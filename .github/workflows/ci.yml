name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (plugin)
        run: node --check lib/index.js && node --check lib/client.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check (backend)
        run: |
          python -c "compile(open('backend/deck').read(),'pagent','exec')"
          python -m py_compile backend/panel.py
          python -c "compile(open('backend/deck-node').read(),'pagent-node','exec')"
      - name: Shell check
        run: bash -n install.sh
